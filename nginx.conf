user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Events
events {
    worker_connections  1024;
}

# HTTP server
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        root /usr/share/nginx/html;

        location /portfolio {
            try_files $uri $uri/ /web/index.html;
        }
        location /portfolio/contact {
            try_files $uri $uri/ /web/contact.html;
        }
        location /portfolio/context {
            try_files $uri $uri/ /web/context.html;
        }
        location /portfolio/ticket {
            try_files $uri $uri/ /web/ticket.html;
        }
        location /portfolio/css/ {
            alias /usr/share/nginx/html/css/;
        }
        location /portfolio/img/ {
            alias /usr/share/nginx/html/img/;
        }
        location /portfolio/web/ {
            alias /usr/share/nginx/html/web/;
        }
        location /portfolio/animation.js {
            alias /usr/share/nginx/html/animation.js;
        }
    }
}
